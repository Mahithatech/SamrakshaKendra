name: Samraksha Kendra scheduled source ingestion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samraksha-kendra-ingestion
  cancel-in-progress: false

jobs:
  source-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger the authenticated ingestion pipeline
        env:
          SK_PIPELINE_CRON_TOKEN: ${{ secrets.SK_PIPELINE_CRON_TOKEN }}
          PIPELINE_URL: https://samraksha-kendra-api.onrender.com/internal/pipeline/run-scheduled
        run: |
          if [ -z "$SK_PIPELINE_CRON_TOKEN" ]; then
            echo "::error::Repository secret SK_PIPELINE_CRON_TOKEN is not configured."
            exit 1
          fi
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          url = os.environ['PIPELINE_URL']
          token = os.environ['SK_PIPELINE_CRON_TOKEN']
          request = urllib.request.Request(
              url,
              data=b'{}',
              headers={
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'X-Pipeline-Token': token,
                  'User-Agent': 'SamrakshaKendra-GitHubActions/1.0',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=360) as response:
                  payload = json.loads(response.read().decode('utf-8'))
                  print(json.dumps({k: payload.get(k) for k in (
                      'run_id', 'status', 'who_seen', 'ncdc_seen', 'new_who_documents',
                      'new_ncdc_documents', 'pdf_attempted', 'pdf_extracted',
                      'candidates_added', 'candidates_flagged', 'anomalies_found',
                      'events_created', 'event_delivery', 'note'
                  ) if k in payload}, indent=2))
          except urllib.error.HTTPError as exc:
              # Do not print request headers or token values.
              print(f'Pipeline trigger failed: HTTP {exc.code}', file=sys.stderr)
              try:
                  print(exc.read(1000).decode('utf-8', errors='replace'), file=sys.stderr)
              except Exception:
                  pass
              raise
          PY
