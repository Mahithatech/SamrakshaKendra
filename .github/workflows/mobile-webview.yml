name: Mobile WebView verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-webview.yml'

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run bundle:android

  live-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Read-only live desktop and mobile viewport smoke
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          website = "https://samrakshakendra.onrender.com"
          api = "https://samraksha-kendra-api.onrender.com"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for width, height, mobile in [(1366, 900, False), (390, 844, True)]:
                  context = browser.new_context(viewport={"width": width, "height": height}, is_mobile=mobile, has_touch=mobile)
                  page = context.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  response = page.goto(website, wait_until="domcontentloaded", timeout=90000)
                  assert response and response.ok
                  expect(page.get_by_role("heading", name="Samraksha Kendra", exact=True)).to_be_visible(timeout=30000)
                  expect(page.locator('input[type="email"]')).to_be_visible()
                  expect(page.locator('input[type="password"]')).to_be_visible()
                  page.get_by_role("button", name="Register", exact=True).click()
                  expect(page.get_by_text("Full name", exact=True)).to_be_visible()
                  page.get_by_role("button", name="User sign in", exact=True).click()
                  expect(page.locator('input[type="email"]')).to_be_visible()
                  assert not errors, errors
                  print(f"Live login/register navigation passed: {width}x{height}")
                  context.close()
              root = p.request.new_context(timeout=120000)
              response = root.get(api + "/")
              assert response.ok, f"API root returned {response.status}"
              protected = root.get(api + "/admin/pipeline/status")
              assert protected.status == 401, f"Protected API returned {protected.status}"
              print("Live API root and anonymous admin protection passed")
              browser.close()
          PY
